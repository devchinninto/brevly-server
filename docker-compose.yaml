services:
  pg:
    image: postgres:17-alpine
    container_name: brevly-server
    ports:
      - '5432:5432'
    env_file:
      - '.env'
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 2s
      timeout: 3s
      retries: 10
